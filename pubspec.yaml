name: blackbox_driver_care
description: AI 기반 교통사고 과실 비율 분석 및 운전자 초동 대처 지원 플랫폼
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # ── 상태 관리 ──────────────────────────────────────────────
  flutter_riverpod: ^2.4.9          # 전역 상태 관리 (메인페이지 상태, 사고 감지 상태 등)
  riverpod_annotation: ^2.3.3

  # ── 내비게이션 ─────────────────────────────────────────────
  go_router: ^13.2.0                # 화면 라우팅 (딥링크, 긴급 화면 즉시 전환)

  # ── 네트워크 / HTTP ────────────────────────────────────────
  dio: ^5.4.1                       # REST API 통신 (과실 산정 서버, 판례 검색 API)
  http: ^1.2.0

  # ── 카메라 / 영상 ──────────────────────────────────────────
  camera: ^0.10.5+9                 # 사고 현장 촬영 (초동 대처 화면)
  video_player: ^2.11.1              # 블랙박스 영상 재생
  image_picker: ^1.0.7              # 갤러리/카메라에서 영상·이미지 선택
  image_cropper: ^12.2.1             # 이미지 크롭 (번호판, 면허증 영역 추출)

  # ── OCR / 문자 인식 ────────────────────────────────────────
  google_mlkit_text_recognition: ^0.13.0   # 운전면허증 OCR, 번호판 인식

  # ── 위치 / 지도 ────────────────────────────────────────────
  geolocator: ^11.0.0               # GPS 좌표 취득 (사고 위치 기록)
  geocoding: ^3.0.0                 # 좌표 → 주소 변환
  flutter_naver_map: ^1.1.0         # 네이버 지도 (사고 다발 구역 안내)
  #  대안: google_maps_flutter: ^2.5.3  (구글 맵 선호 시 교체)
  flutter_map: ^6.2.1               # 사고 위치 지도 (OSM 타일, API 키 불필요)
  latlong2: ^0.9.1                  # flutter_map 좌표 타입

  # ── 센서 (E-Call 자동 감지) ────────────────────────────────
  sensors_plus: ^4.0.2              # 가속도·자이로스코프 (충격 감지 High-G)

  # ── 오디오 / STT ───────────────────────────────────────────
  record: ^7.0.0
  audioplayers: ^5.2.1              # 알림음 재생

  # ── 파일 / 저장 ────────────────────────────────────────────
  path_provider: ^2.1.2             # 로컬 파일 경로 (영상·리포트 임시 저장)
  permission_handler: ^11.3.0       # 카메라·마이크·위치 권한 요청
  open_file: ^3.3.2                 # 저장된 PDF 리포트 열기
  flutter_file_dialog: ^3.0.1       # 파일 저장 다이얼로그

  # ── PDF 리포트 ─────────────────────────────────────────────
  pdf: ^3.10.8                      # 사고 분석 디지털 리포트 PDF 생성
  printing: ^5.12.0                 # PDF 미리보기 및 공유

  # ── 로컬 DB ────────────────────────────────────────────────

  # ── 암호화 / 해시 (디지털 타임스탬프) ──────────────────────
  crypto: ^3.0.3                    # SHA-256 해시 (녹취·사진 위변조 방지)
  flutter_secure_storage: ^9.0.0    # 민감 정보 암호화 저장

  # ── UI 컴포넌트 ────────────────────────────────────────────
  flutter_svg: ^2.0.10+1            # SVG 아이콘
  cached_network_image: ^3.3.1      # 네트워크 이미지 캐싱
  shimmer: ^3.0.0                   # 스켈레톤 로딩 UI
  lottie: ^3.1.0                    # Lottie 애니메이션 (사고 감지 알림)
  fl_chart: ^0.67.0                 # 과실 비율 도넛 차트
  timeline_tile: ^2.0.0             # 사고 처리 타임라인 (D-Day 대시보드)
  percent_indicator: ^4.2.3         # 원형 진행 바 (AI 분석 진행률)

  # ── 알림 ───────────────────────────────────────────────────
  flutter_local_notifications: ^17.1.2   # 로컬 푸시 (충격 감지 알림)
  firebase_core: ^3.15.0            # Firebase 초기화
  firebase_messaging: ^15.2.5      # FCM 푸시 (보험사 연동 알림)

  # ── 백그라운드 작업 ────────────────────────────────────────
  connectivity_plus: ^6.0.3         # 네트워크 상태 감지 (Wi-Fi 전환 시 업로드)

  # ── SMS / 전화 ─────────────────────────────────────────────
  url_launcher: ^6.2.5              # 119 전화, SMS 긴급 연락처 발신

  # ── 기상 API ───────────────────────────────────────────────
  weather: ^3.1.1                   # 기상 정보 (사고 위험도 예측)

  # ── AI / LLM 챗봇 ──────────────────────────────────────────
  dart_openai: ^4.1.4               # OpenAI API (문처리 챗봇 LLM)
  flutter_markdown: ^0.6.22         # 챗봇 마크다운 렌더링
  google_generative_ai: ^0.4.6

  # ── 유틸리티 ──────────────────────────────────────────────
  intl: ^0.19.0                     # 날짜·숫자 포맷 (한국어)
  uuid: ^4.3.3                      # 사고 ID 생성
  logger: ^2.2.0                    # 디버그 로그
  freezed_annotation: ^2.4.1        # 불변 데이터 모델

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8              # 코드 생성 (freezed, retrofit, drift)
  freezed: ^2.4.7                   # 불변 모델 코드 생성
  json_serializable: ^6.7.1         # JSON 직렬화 코드 생성
  riverpod_generator: ^2.3.9        # Riverpod provider 코드 생성

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/fonts/
    - assets/data/

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700


